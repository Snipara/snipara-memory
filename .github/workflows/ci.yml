name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        # Keep the CI baseline explicit so new Ruff releases do not silently
        # enable broader rule families for an unchanged package.
        run: ruff check --select E4,E7,E9,F src tests

      - name: Test
        run: pytest tests -v --tb=short

      - name: Build
        run: python -m build
